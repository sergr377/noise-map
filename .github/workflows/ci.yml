# Everything here runs without Java, without the NoiseModelling distribution and
# without network access to Overpass — because none of those are what the HTTP
# layer is made of. The end-to-end check (scripts/smoke-api.mjs) does run here,
# against a server whose calculation is replaced by scripts/fake-job.mjs: same
# marker protocol, same files, no acoustics. So the queue, the progress stream,
# cancellation, the cache and the limiter are gated by CI; whether the numbers
# on a real map are right is not, and never will be from a free runner —
# sanity-check.mjs and compare-runs.mjs remain a job for a human with the
# engine installed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The server reads .env through process.loadEnvFile, which is Node 22.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линтер и форматирование
        run: npm run lint

      - name: Юнит-тесты
        run: npm test

      - name: Сборка сервера
        run: npm run build:server

      # Two clicks a few metres apart must land in the same cache cell, and the
      # check needs the compiled server. ~88 000 points, a couple of seconds.
      - name: Идемпотентность сетки кэша
        run: node scripts/check-quantize.mjs

      # The HTTP layer end to end, against a stubbed engine. Frames and the rate
      # limiter are switched on deliberately: with the defaults the smoke test
      # reports those checks as skipped — loopback is exempt from the limiter
      # and frames are off — and they are exactly the routes nothing else
      # covers. A cold run takes about fifteen seconds.
      - name: Сквозная проверка HTTP-слоя
        env:
          PORT: 8787
          RUN_JOB_SCRIPT: scripts/fake-job.mjs
          # Somewhere disposable: these maps are invented, and the cache key
          # marks them as such so a real server could not read them anyway.
          CACHE_DIR: ${{ runner.temp }}/noise-cache
          FAKE_JOB_MS: 6000
          PARTIAL_INTERVAL_MS: 800
          RATE_LIMIT_LOOPBACK: 1
        run: |
          node server/dist/index.js &
          server=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/api/health > /dev/null && break
            sleep 1
          done
          set +e
          node scripts/smoke-api.mjs
          status=$?
          set -e
          kill $server 2> /dev/null || true
          exit $status

      # Читает кэш, который наполнил предыдущий шаг, поэтому CACHE_DIR тот же —
      # и заглушка тоже та же: признак подмены входит в ключ кэша, так что
      # сервер с настоящим движком не прочитал бы записанное заглушкой даже из
      # этого же каталога. Режим ничего не считает, движок ему нужен только
      # затем, чтобы ключи совпали.
      - name: Режим только из кэша
        env:
          PORT: 8787
          RUN_JOB_SCRIPT: scripts/fake-job.mjs
          CACHE_DIR: ${{ runner.temp }}/noise-cache
          CACHE_ONLY: 1
        run: |
          node server/dist/index.js &
          server=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/api/health > /dev/null && break
            sleep 1
          done
          set +e
          node scripts/smoke-cache-only.mjs
          status=$?
          set -e
          kill $server 2> /dev/null || true
          exit $status

      # Никаких ключей: подложка своя, геокодер по данным OSM.
      - name: Сборка фронтенда
        run: npm run build:web
