services:
  noise-map:
    build:
      context: .
      args:
        # Ключ карт нужен именно на сборке — Vite вшивает его в бандл.
        VITE_YANDEX_API_KEY: ${VITE_YANDEX_API_KEY:-}
    ports:
      - '8787:8787'
    environment:
      PORT: 8787
      # Один расчёт уже занимает все ядра; второй параллельный только замедлит оба.
      MAX_CONCURRENT_JOBS: 1
      # Ключ геокодера остаётся на сервере: у него нет ограничения по referer.
      YANDEX_GEOCODER_KEY: ${YANDEX_GEOCODER_KEY:-}
      # Поставьте 1, чтобы отдавать только заранее посчитанные места и не пускать
      # на маленький хост многоминутные расчёты.
      CACHE_ONLY: ${CACHE_ONLY:-0}
    volumes:
      # Кэш результатов и рабочие каталоги переживают пересборку образа.
      - noise-cache:/app/cache
      - noise-jobs:/app/jobs
    # Пик потребления JVM на плотной застройке — около 1.8 ГБ.
    mem_limit: 3g
    restart: unless-stopped

volumes:
  noise-cache:
  noise-jobs:
