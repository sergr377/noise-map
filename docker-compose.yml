services:
  noise-map:
    build:
      context: .
    ports:
      - '8787:8787'
    environment:
      PORT: 8787
      # Один расчёт уже занимает все ядра; второй параллельный только замедлит оба.
      MAX_CONCURRENT_JOBS: 1
      # Геокодер по данным OSM. Пусто — публичный инстанс Nominatim с его
      # правилом «не чаще запроса в секунду», которое сервер соблюдает сам.
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      NOMINATIM_CONTACT: ${NOMINATIM_CONTACT:-}
      # Поставьте 1, чтобы отдавать только заранее посчитанные места и не пускать
      # на маленький хост многоминутные расчёты.
      CACHE_ONLY: ${CACHE_ONLY:-0}
    volumes:
      # Кэш результатов и рабочие каталоги переживают пересборку образа.
      - noise-cache:/app/cache
      - noise-jobs:/app/jobs
      # Подложка: собирается на хосте (node scripts/build-tiles.mjs) и
      # подключается как есть. Каталогом, а не томом, именно затем, чтобы её
      # можно было пересобрать снаружи и перезапустить контейнер. Только на
      # чтение: сервер её раздаёт и не трогает.
      - ./tiles:/app/tiles:ro
    # Пик потребления JVM на плотной застройке — 2.2 ГБ на радиусе показа 750 м.
    mem_limit: 4g
    restart: unless-stopped

volumes:
  noise-cache:
  noise-jobs:
